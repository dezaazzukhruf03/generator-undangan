<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial sacle=1.0">
    <title>Generator Undangan</title>

    <link rel="stylesheet" href="style.css">

  </head>
  <body>

    <div class="container">

      <h1> Generator Undangan</h1>

    <form>

      <label>Nama Tamu</label>
      <br>

      <input 
        type="text"
        id=guestName
        placeholder="Masukkan Nama Tamu">

      <br>

      <label>Pilih Website</label>

<select id="websiteSelect">

    <option value="" selected disabled>
        -- Pilih Website --
    </option>

    <option value="laradeza">
        Lara & Deza (24 Oktober 2026)
    </option>

    <option value="dezalara">
        Deza & Lara (01 November 2026)
    </option>

    <option value="ekaarian">
        Eka & Arian (04 September 2026)
    </option>

    <option value="putrirama">
        Putri & Rama (23 Agustus 2026)
    </option>

</select>

      <br>

      <button type="button" id="generateBtn">
        Generate
      </button>

    </form>
      
      <h2>Hasil URL</h2>

      <p id="resultUrl">
        Hasil url akan muncul disini
      </p>

      <div class="action-buttons">
        <button type="button" id="copyBtn">
          Copy Link
        </button>

        <button type="button" id="openBtn">
          Buka Link
        </button>
      </div>

      <button type="button" id="resetBtn" class="btn-secondary">
        Reset
      </button>

    </div>

    <script src="script.js"></script>
  </body>
</html>
